<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator</title>
</head>
<body>
<h1>Calculator</h1>
<div id="display">0</div>
<div id="keys">
<button>7</button><button>8</button><button>9</button>
<button>4</button><button>5</button><button>6</button>
<button>1</button><button>2</button><button>3</button>
<button>0</button><button>.</button><button>C</button>
<button>+</button><button>-</button><button>=</button>
<button>±</button>
</div>
<script>
(function () {
  var display = document.getElementById('display');
  var entry = '0';
  var total = null;   // left-hand side of a half-finished sum
  var op = null;      // pending '+' or '-'
  var fresh = false;  // the next digit starts a new number
  var negate = false; // ± was pressed while waiting for the next number

  // Exact arithmetic: numbers are held as integers of 1/10000, matching the
  // four decimals the keys can enter, so there is no floating-point noise
  // and no exponent notation for huge results.
  function toUnits(text) {
    var parts = text.split('.');
    return BigInt(parts[0] + ((parts[1] || '') + '0000').slice(0, 4));
  }

  function fromUnits(n) {
    var sign = n < 0n ? '-' : '';
    var digits = (n < 0n ? -n : n).toString().padStart(5, '0');
    return sign + digits.slice(0, -4) + '.' + digits.slice(-4);
  }

  function apply() {
    if (op === null) return;
    var r = op === '+' ? toUnits(total) + toUnits(entry) : toUnits(total) - toUnits(entry);
    entry = fromUnits(r);
    op = null;
    total = null;
  }

  function press(key) {
    if (key === '+' || key === '-' || key === '=') {
      negate = false;
      if (!(fresh && op !== null)) apply();
      if (key === '=') {
        fresh = true;
      } else {
        total = entry;
        op = key;
        fresh = true;
      }
      display.textContent = format(entry);
      return;
    }
    if (key === '±') {
      if (!/^0*\.?0*$/.test(entry)) {
        entry = entry.charAt(0) === '-' ? entry.slice(1) : '-' + entry;
      }
      if (fresh && op !== null) negate = !negate;
    } else if (key === 'C') {
      entry = '0';
      total = null;
      op = null;
      fresh = false;
      negate = false;
    } else {
      if (fresh) { entry = '0'; fresh = false; }
      typeKey(key);
      if (negate) {
        if (key === '.' || !/^0*\.?0*$/.test(entry)) {
          negate = false;
          entry = '-' + entry;
        }
      }
    }
    display.textContent = format(entry);
  }

  function typeKey(key) {
    if (key === '.') {
      if (entry.indexOf('.') === -1) entry += '.';
    } else if (entry === '0') {
      entry = key;
    } else {
      entry += key;
    }
    var dot = entry.indexOf('.');
    if (dot !== -1 && entry.length - dot - 1 > 4) entry = entry.slice(0, dot + 5);
  }

  // Entry keeps zeros typed after the point so later digits land correctly;
  // the display drops them, except for the bare "0." of an unfinished number.
  function format(text) {
    if (text.indexOf('.') === -1 || text.charAt(text.length - 1) === '.') return text;
    return text.replace(/0+$/, '').replace(/\.$/, '');
  }

  var buttons = document.querySelectorAll('button');
  for (var i = 0; i < buttons.length; i++) {
    (function (b) {
      b.addEventListener('click', function () { press(b.textContent); });
    })(buttons[i]);
  }
})();
</script>
</body>
</html>
