<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
</head>
<body>
  <h1>Calculator</h1>
  <div id="display">0</div>
  <div id="keys">
    <button type="button">7</button>
    <button type="button">8</button>
    <button type="button">9</button>
    <button type="button">4</button>
    <button type="button">5</button>
    <button type="button">6</button>
    <button type="button">1</button>
    <button type="button">2</button>
    <button type="button">3</button>
    <button type="button">0</button>
    <button type="button">.</button>
    <button type="button">C</button>
    <button type="button">±</button>
    <button type="button">+</button>
    <button type="button">-</button>
    <button type="button">×</button>
    <button type="button">÷</button>
    <button type="button">=</button>
  </div>
  <script>
    var display = document.getElementById('display');
    var typed = '0';
    var total = null;
    var op = null;
    var fresh = false;
    document.getElementById('keys').addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      var key = button.textContent.trim();
      if (key === 'C') {
        typed = '0';
        total = null;
        op = null;
        fresh = false;
      } else if (typed === 'Error' && (key === '±' || key === '+' || key === '-' || key === '×' || key === '÷' || key === '=')) {
        // Only a digit or C leaves Error.
      } else if (key === '±') {
        if (scale(typed) !== 0n) {
          typed = typed.charAt(0) === '-' ? typed.slice(1) : '-' + typed;
        }
      } else if (key === '+' || key === '-' || key === '×' || key === '÷') {
        total = op && !fresh ? apply(total, op, typed) : scale(typed);
        if (total === null) return fail();
        op = key;
        typed = unscale(total);
        fresh = true;
      } else if (key === '=') {
        if (op) {
          var result = apply(total, op, typed);
          if (result === null) return fail();
          typed = unscale(result);
          total = null;
          op = null;
          fresh = true;
        }
      } else {
        if (fresh) {
          typed = '0';
          fresh = false;
        }
        enter(key);
      }
      display.textContent = format(typed);
    });
    function scale(text) {
      var negative = text.charAt(0) === '-';
      var parts = text.replace('-', '').split('.');
      var fraction = ((parts[1] || '') + '0000').slice(0, 4);
      var value = BigInt(parts[0] || '0') * 10000n + BigInt(fraction);
      return negative ? -value : value;
    }
    function unscale(value) {
      var negative = value < 0n;
      var digits = String(negative ? -value : value).padStart(5, '0');
      var text = digits.slice(0, -4) + '.' + digits.slice(-4);
      return (negative ? '-' : '') + text;
    }
    function fail() {
      typed = 'Error';
      total = null;
      op = null;
      fresh = true;
      display.textContent = typed;
    }
    // Round a quotient to a whole number, halves away from zero.
    function divide(a, b) {
      var negative = (a < 0n) !== (b < 0n);
      var x = a < 0n ? -a : a;
      var y = b < 0n ? -b : b;
      var q = (x * 2n + y) / (y * 2n);
      return negative ? -q : q;
    }
    function apply(left, operator, right) {
      var b = scale(right);
      if (operator === '+') return left + b;
      if (operator === '-') return left - b;
      if (operator === '×') return divide(left * b, 10000n);
      return b === 0n ? null : divide(left * 10000n, b);
    }
    function enter(key) {
      if (key === '.') {
        if (typed.indexOf('.') === -1) typed += '.';
      } else if (typed === '0') {
        typed = key;
      } else if (typed.indexOf('.') === -1 || typed.length - typed.indexOf('.') - 1 < 4) {
        typed += key;
      }
    }
    function format(text) {
      var point = text.indexOf('.');
      if (point === -1 || point === text.length - 1) return text;
      var trimmed = text.replace(/0+$/, '');
      return trimmed.charAt(trimmed.length - 1) === '.' ? trimmed.slice(0, -1) : trimmed;
    }
  </script>
</body>
</html>
