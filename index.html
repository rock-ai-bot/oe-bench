<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
</head>
<body>
  <h1>Calculator</h1>
  <div id="display">0</div>
  <div id="keys">
    <button type="button">7</button>
    <button type="button">8</button>
    <button type="button">9</button>
    <button type="button">4</button>
    <button type="button">5</button>
    <button type="button">6</button>
    <button type="button">1</button>
    <button type="button">2</button>
    <button type="button">3</button>
    <button type="button">0</button>
    <button type="button">.</button>
    <button type="button">C</button>
  </div>
  <script>
    var display = document.getElementById('display');
    var typed = '0';
    document.getElementById('keys').addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      var key = button.textContent.trim();
      if (key === 'C') {
        typed = '0';
      } else if (key === '.') {
        if (typed.indexOf('.') === -1) typed += '.';
      } else if (typed === '0') {
        typed = key;
      } else if (typed.indexOf('.') === -1 || typed.length - typed.indexOf('.') - 1 < 4) {
        typed += key;
      }
      display.textContent = format(typed);
    });
    function format(text) {
      var point = text.indexOf('.');
      if (point === -1 || point === text.length - 1) return text;
      var trimmed = text.replace(/0+$/, '');
      return trimmed.charAt(trimmed.length - 1) === '.' ? trimmed.slice(0, -1) : trimmed;
    }
  </script>
</body>
</html>
